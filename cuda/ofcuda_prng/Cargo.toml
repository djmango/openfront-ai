[package]
name = "ofcuda_prng"
version = "0.1.0"
edition = "2024"
default-run = "ofcuda_prng"

[workspace]

[dependencies]
cuda-device = { git = "https://github.com/NVlabs/cuda-oxide.git" }
cuda-host = { git = "https://github.com/NVlabs/cuda-oxide.git" }
# Shared host-side runtime, published from NVlabs/cutile-rs.
cuda-core = "0.3.1"
serde_json = "1"

[[bin]]
name = "ofcuda_prng"
path = "src/main.rs"

[[bin]]
name = "ofcuda_prng_cpu"
path = "src/bin/cpu.rs"

# Generic N-bot spawn / initial-state check: same device kernel, host driver
# generalised to arbitrary N. See src/bin/spawnall.rs.
[[bin]]
name = "spawnall"
path = "src/bin/spawnall.rs"
